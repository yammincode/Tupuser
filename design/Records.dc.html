<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>入場紀錄</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans TC','PingFang TC',sans-serif;background:#F3F0EA}
a{color:#B24A22}a:hover{color:#8E3A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F0EA; color: #1C1A17; font-family: 'Noto Sans TC','PingFang TC',sans-serif">
<div style="padding: 28px 24px 0 24px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; letter-spacing: 2px; color: #5E584F">原岩攀岩館</div>
<div style="font-size: 24px; font-weight: 700">入場紀錄</div>
</div>
<div style="margin: 20px 24px 0 24px; padding: 18px 20px; background: #FFFFFF; border-radius: 16px; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; color: #5E584F">本月入場</div>
<div style="font-size: 22px; font-weight: 700">6 次</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-end">
<div style="font-size: 13px; color: #5E584F">剩餘次數</div>
<div style="font-size: 22px; font-weight: 700; color: #B24A22">8 次</div>
</div>
</div>
<div style="margin: 16px 24px 0 24px; background: #FFFFFF; border-radius: 16px; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
<div style="padding: 16px 20px; border-bottom: 1px solid #ECE7DE; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 15px; font-weight: 500">{{row.branch}}</div>
<div style="font-size: 13px; color: #5E584F">{{row.when}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-end">
<div style="font-size: 15px; font-weight: 500">−1 次</div>
<div style="font-size: 13px; color: #5E584F">{{row.left}}</div>
</div>
</div>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<div style="height: 76px; border-top: 1px solid #DDD7CC; background: #FFFFFF; display: flex">
<a href="Main.dc.html" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E584F; font-size: 12px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6"></rect><rect x="14" y="4" width="6" height="6"></rect><rect x="4" y="14" width="6" height="6"></rect><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2"></path></svg>
入場碼</a>
<a href="Records.dc.html" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #B24A22; font-size: 12px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>
紀錄</a>
<a href="Plans.dc.html" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E584F; font-size: 12px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"></path><path d="M14 5v12"></path></svg>
方案</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { branch: '[分館 A]', when: '9/27（日）14:32', left: '剩 8 次' },
        { branch: '[分館 B]', when: '9/24（四）19:05', left: '剩 9 次' },
        { branch: '[分館 A]', when: '9/20（日）10:48', left: '剩 10 次' },
        { branch: '[分館 A]', when: '9/17（四）20:11', left: '剩 11 次' },
        { branch: '[分館 C]', when: '9/13（日）15:26', left: '剩 12 次' },
        { branch: '[分館 A]', when: '9/9（三）19:40', left: '剩 13 次' }
      ]
    };
  }
}
</script>
</body>
</html>
