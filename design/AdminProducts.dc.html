<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>總部・品項管理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans TC','PingFang TC',sans-serif;background:#F3F0EA}
a{color:#B24A22}a:hover{color:#8E3A1A}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F0EA; color: #1C1A17; font-family: 'Noto Sans TC','PingFang TC',sans-serif">
<div style="height: 56px; flex-shrink: 0; padding: 0 24px; background: #1C1A17; color: #F3F0EA; display: flex; align-items: center; justify-content: space-between">
<div style="width: 300px; display: flex; align-items: center; gap: 14px"><span style="font-size: 17px; font-weight: 700; letter-spacing: 2px">原岩攀岩館</span><span style="font-size: 15px; color: #CFC8BC">總部後台</span></div>
<nav aria-label="主選單" style="display: flex; gap: 6px"><a href="AdminProducts.dc.html" style="height: 40px; padding: 0 18px; border-radius: 10px; background: #F3F0EA; color: #1C1A17; font-weight: 500; font-size: 15px; text-decoration: none; display: flex; align-items: center">品項管理</a><a href="AdminStaff.dc.html" style="height: 40px; padding: 0 18px; border-radius: 10px; background: transparent; color: #CFC8BC; font-size: 15px; text-decoration: none; display: flex; align-items: center">員工與權限</a></nav>
<div style="width: 300px; text-align: right; font-size: 14px; color: #CFC8BC">管理者：[總部人員]</div>
</div>
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 16px; padding: 16px">
<div style="flex-grow: 1; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16px; font-weight: 700">品項（範例價格）</span><div style="display: flex; gap: 8px"><button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17">顯示已下架</button><button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17; border-color: #B24A22; color: #B24A22">＋ 新增品項</button></div></div>
<div style="display: grid; grid-template-columns: minmax(0, 1.6fr) 90px minmax(0, 1fr) 70px 90px 70px; padding: 6px 0; border-bottom: 1px solid #DDD7CC; font-size: 13px; color: #5E584F"><span>名稱</span><span>價格</span><span>內容</span><span>適用</span><span>分館</span><span>狀態</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="display: grid; grid-template-columns: minmax(0, 1.6fr) 90px minmax(0, 1fr) 70px 90px 70px; padding: 8px 0; border-bottom: 1px solid #ECE7DE; font-size: 14px; align-items: center; background: {{r.bg}}">
<span style="display: flex; align-items: center; gap: 8px; font-weight: 500"><span style="width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; background: {{r.dot}}"></span>{{r.n}}</span><span>{{r.p}}</span><span style="color: #5E584F">{{r.c}}</span><span>{{r.d}}</span><span>{{r.b}}</span><span style="color: {{r.sc}}">{{r.s}}</span>
</div>
</sc-for>
</div>
<div style="width: 400px; flex-shrink: 0; background: #FFFFFF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 16px; font-weight: 700">新增品項</span>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="p1" style="font-size: 14px; font-weight: 500">名稱</label><input id="p1" type="text" placeholder="例：萬聖節活動票" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-family: inherit; color: #1C1A17"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="p2" style="font-size: 14px; font-weight: 500">分類（決定顏色）</label><select id="p2" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-family: inherit; color: #1C1A17"><option>新手與活動</option><option>平日入場</option><option>假日入場</option><option>兒童</option><option>套票・年月票</option><option>裝備租借</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="p3" style="font-size: 14px; font-weight: 500">價格</label><input id="p3" type="text" placeholder="NT$" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-family: inherit; color: #1C1A17"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="p4" style="font-size: 14px; font-weight: 500">內容</label><select id="p4" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-family: inherit; color: #1C1A17"><option>單次入場</option><option>次數</option><option>天數</option><option>課程堂數</option><option>商品／租借</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="p5" style="font-size: 14px; font-weight: 500">數量</label><input id="p5" type="text" placeholder="次數、天數或堂數" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-family: inherit; color: #1C1A17"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 500">適用條件</span><div style="display: flex; gap: 8px"><button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17; background: #1C1A17; color: #FFFFFF; border-color: #1C1A17">不限</button><button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17">平日</button><button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17">假日</button><button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17">時段</button></div></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="p6" style="font-size: 14px; font-weight: 500">適用分館</label><select id="p6" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-family: inherit; color: #1C1A17"><option>全店通用</option><option>中和店</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="p7" style="font-size: 14px; font-weight: 500">上架期間（選填）</label><input id="p7" type="text" placeholder="10/1 – 10/31" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-family: inherit; color: #1C1A17"></div>
</div>
<div style="flex-grow: 1"></div>
<span style="font-size: 13px; color: #5E584F">品項不能刪除，只能下架；舊訂單會保留當時的品名和價格。</span>
<button type="button" style="height: 52px; padding: 0 24px; border: none; border-radius: 12px; background: #B24A22; color: #FFFFFF; font-size: 17px; font-weight: 500; font-family: inherit">儲存並上架</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const c = { wd: '#C99A1E', we: '#2F6B57', kid: '#B94A77', pass: '#B24A22', nw: '#3B62A0', rent: '#6B655C' };
    const on = (n, p, cnt, d, b, dot) => ({ n, p, c: cnt, d, b, dot, s: '上架', sc: '#2F6B57', bg: '#FFFFFF' });
    const rows = [
      on('平日全天票', 'NT$ 350', '單次入場', '平日', '全店', c.wd),
      on('平日下午時段', 'NT$ 280', '單次入場', '時段', '全店', c.wd),
      on('假日全天票', 'NT$ 450', '單次入場', '假日', '全店', c.we),
      on('兒童票（7–12 歲）', 'NT$ 250', '單次入場', '不限', '全店', c.kid),
      on('套票（中和店）', 'NT$ 3,000', '10 次', '不限', '中和店', c.pass),
      on('套票（全店通）', 'NT$ 3,600', '10 次', '不限', '全店', c.pass),
      on('月票', 'NT$ 2,800', '30 天', '不限', '全店', c.pass),
      on('新客爬三次送月票', 'NT$ 900', '3 次', '不限', '全店', c.nw),
      on('初階攀岩鞋', 'NT$ 100', '租借', '不限', '全店', c.rent)
    ];
    rows.push({ n: '暑假兒童體驗營', p: 'NT$ 1,500', c: '4 堂', d: '不限', b: '中和店', dot: c.nw, s: '下架', sc: '#5E584F', bg: '#F7F5F1' });
    return { rows };
  }
}
</script>
</body>
</html>
