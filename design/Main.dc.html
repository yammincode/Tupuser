<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>入場碼</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans TC','PingFang TC',sans-serif;background:#F3F0EA}
a{color:#B24A22}a:hover{color:#8E3A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F0EA; color: #1C1A17; font-family: 'Noto Sans TC','PingFang TC',sans-serif">
<div style="padding: 28px 24px 0 24px; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; letter-spacing: 2px; color: #5E584F">原岩攀岩館</div>
<div style="font-size: 24px; font-weight: 700">嗨，林小岩</div>
</div>
<div style="margin: 20px 24px 0 24px; padding: 24px; background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="font-size: 15px; font-weight: 500">入場碼</div>
<div style="width: 225px; height: 225px; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); gap: 0">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="625">
<div style="background: {{c.fill}}"></div>
</sc-for>
</div>
<div style="font-size: 13px; color: #5E584F">{{seconds}} 秒後自動更新</div>
<div style="font-size: 14px; color: #1C1A17">請出示給櫃檯掃描入場</div>
</div>
<div style="margin: 16px 24px 0 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="padding: 18px; background: #FFFFFF; border-radius: 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #5E584F">剩餘次數</div>
<div style="display: flex; align-items: baseline; gap: 4px"><span style="font-size: 36px; font-weight: 700; color: {{accent}}">8</span><span style="font-size: 15px">次</span></div>
</div>
<div style="padding: 18px; background: #FFFFFF; border-radius: 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; color: #5E584F">到期日</div>
<div style="font-size: 20px; font-weight: 700; padding-top: 10px">2026/12/31</div>
</div>
</div>
<div style="margin: 12px 24px 0 24px; font-size: 13px; color: #5E584F">目前方案：二十次卡・全分館通用</div>
<div style="flex-grow: 1"></div>
<div style="height: 76px; border-top: 1px solid #DDD7CC; background: #FFFFFF; display: flex">
<a href="Main.dc.html" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 500">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6"></rect><rect x="14" y="4" width="6" height="6"></rect><rect x="4" y="14" width="6" height="6"></rect><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2"></path></svg>
入場碼</a>
<a href="Records.dc.html" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E584F; font-size: 12px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>
紀錄</a>
<a href="Plans.dc.html" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E584F; font-size: 12px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"></path><path d="M14 5v12"></path></svg>
方案</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B24A22","options":["#B24A22","#2F5D50","#2B4C7E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { seconds: 30, seed: 1 }; }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state.seconds - 1;
      if (s <= 0) this.setState({ seconds: 30, seed: this.state.seed + 1 });
      else this.setState({ seconds: s });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  finder(r, c) {
    const corners = [[0, 0], [0, 18], [18, 0]];
    for (const [r0, c0] of corners) {
      const y = r - r0, x = c - c0;
      if (y >= -1 && y <= 7 && x >= -1 && x <= 7) {
        if (y < 0 || y > 6 || x < 0 || x > 6) return 0;
        if (y === 0 || y === 6 || x === 0 || x === 6) return 1;
        if (y >= 2 && y <= 4 && x >= 2 && x <= 4) return 1;
        return 0;
      }
    }
    return -1;
  }
  renderVals() {
    const ink = '#1C1A17';
    const seed = this.state.seed;
    const cells = [];
    for (let r = 0; r < 25; r++) {
      for (let c = 0; c < 25; c++) {
        let on = this.finder(r, c);
        if (on === -1) {
          const h = Math.sin(r * 12.9898 + c * 78.233 + seed * 3.17) * 43758.5453;
          on = (h - Math.floor(h)) > 0.52 ? 1 : 0;
        }
        cells.push({ fill: on ? ink : '#FFFFFF' });
      }
    }
    return { cells, seconds: this.state.seconds, accent: this.props.accent ?? '#B24A22' };
  }
}
</script>
</body>
</html>
