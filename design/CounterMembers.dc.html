<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>櫃檯・會員</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans TC','PingFang TC',sans-serif;background:#F3F0EA}
a{color:#B24A22}a:hover{color:#8E3A1A}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F0EA; color: #1C1A17; font-family: 'Noto Sans TC','PingFang TC',sans-serif">
<div style="height: 56px; flex-shrink: 0; padding: 0 24px; background: #1C1A17; color: #F3F0EA; display: flex; align-items: center; justify-content: space-between">
<div style="width: 300px; display: flex; align-items: center; gap: 14px"><span style="font-size: 17px; font-weight: 700; letter-spacing: 2px">原岩攀岩館</span><span style="font-size: 15px; color: #CFC8BC">中和店 T-UP・櫃檯</span></div>
<nav aria-label="主選單" style="display: flex; gap: 6px"><a href="Counter.dc.html" style="height: 40px; padding: 0 18px; border-radius: 10px; background: transparent; color: #CFC8BC; font-size: 15px; text-decoration: none; display: flex; align-items: center">結帳</a><a href="CounterMembers.dc.html" style="height: 40px; padding: 0 18px; border-radius: 10px; background: #F3F0EA; color: #1C1A17; font-weight: 500; font-size: 15px; text-decoration: none; display: flex; align-items: center">會員</a><a href="CounterToday.dc.html" style="height: 40px; padding: 0 18px; border-radius: 10px; background: transparent; color: #CFC8BC; font-size: 15px; text-decoration: none; display: flex; align-items: center">今日</a><a href="CounterClose.dc.html" style="height: 40px; padding: 0 18px; border-radius: 10px; background: transparent; color: #CFC8BC; font-size: 15px; text-decoration: none; display: flex; align-items: center">關帳</a></nav>
<div style="width: 300px; text-align: right; font-size: 14px; color: #CFC8BC">櫃檯：[人員]</div>
</div>
<div style="flex-grow: 1; min-height: 0; display: flex; gap: 16px; padding: 16px">
<div style="width: 340px; flex-shrink: 0; background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<label for="q" style="font-size: 16px; font-weight: 700">查詢會員</label>
<input id="q" type="search" placeholder="手機號碼或姓名" value="0912" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-family: inherit; color: #1C1A17">
<div style="display: flex; flex-direction: column">
<sc-for list="{{results}}" as="r" hint-placeholder-count="3">
<div style="padding: 12px; border-radius: 10px; background: {{r.bg}}; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 500">{{r.name}}</span><span style="font-size: 13px; color: #5E584F">{{r.phone}}</span></div>
<span style="font-size: 13px; color: #5E584F">{{r.plan}}</span>
</div>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<a href="CounterRegister.dc.html" style="height: 52px; padding: 0 24px; border: none; border-radius: 12px; background: #B24A22; color: #FFFFFF; font-size: 17px; font-weight: 500; font-family: inherit; display: flex; align-items: center; justify-content: center; text-decoration: none">＋ 新增會員</a>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FFFFFF; border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; gap: 18px">
<div style="width: 72px; height: 72px; border-radius: 36px; background: #DCEBE4; color: #173F32; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center">林</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px"><span style="font-size: 22px; font-weight: 700">林小岩</span><span style="padding: 2px 10px; border-radius: 999px; background: #DCEBE4; color: #173F32; font-size: 13px">正常</span></div>
<div style="font-size: 14px; color: #5E584F">0912-345-678・1994/5/12・主要分館 中和店</div>
<div style="font-size: 14px; color: #173F32">同意書 已簽 v3（2026/3/2 中和店）・載具 /ABC1234</div>
</div>
<div style="display: flex; gap: 8px"><button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17">編輯資料</button><a href="Counter.dc.html" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17; display: flex; align-items: center; text-decoration: none; border-color: #B24A22; color: #B24A22">幫他結帳</a></div>
</div>
<div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16px; font-weight: 700">方案</span><span style="font-size: 12px; color: #5E584F">暫停・延期・轉讓・退費限店長</span></div>
<sc-for list="{{plans}}" as="p" hint-placeholder-count="2">
<div style="padding: 12px 0; border-bottom: 1px solid #ECE7DE; display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 500">{{p.name}}</span><span style="font-size: 13px; color: #5E584F">{{p.detail}}</span></div>
<span style="padding: 2px 10px; border-radius: 999px; background: {{p.bg}}; color: {{p.fg}}; font-size: 13px; white-space: nowrap">{{p.status}}</span>
</div>
</sc-for>
<div style="display: flex; gap: 8px; padding-top: 6px"><button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17">暫停</button><button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17">延期</button><button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17">轉讓</button><button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17">退費</button></div>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 700">最近入場</span>
<sc-for list="{{visits}}" as="v" hint-placeholder-count="5">
<div style="padding: 9px 0; border-bottom: 1px solid #ECE7DE; display: flex; justify-content: space-between; font-size: 14px"><span>{{v.when}}</span><span style="color: #5E584F">{{v.where}}</span></div>
</sc-for>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 700">購買紀錄</span>
<sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
<div style="padding: 9px 0; border-bottom: 1px solid #ECE7DE; display: flex; justify-content: space-between; font-size: 14px"><span>{{o.when}}・{{o.item}}</span><span style="font-weight: 500">{{o.amt}}</span></div>
</sc-for>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
<label for="memo" style="font-size: 16px; font-weight: 700">櫃檯備註（會員看不到）</label>
<textarea id="memo" style="flex-grow: 1; min-height: 80px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #CFC8BC; border-radius: 10px; font-size: 15px; font-family: inherit; color: #1C1A17; resize: none">喜歡週四晚上來，常帶朋友體驗。</textarea>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      results: [
        { name: '林小岩', phone: '0912-345-678', plan: '套票剩 7 次', bg: '#F3F0EA' },
        { name: '林大山', phone: '0912-876-001', plan: '月票', bg: '#FFFFFF' },
        { name: '王小石', phone: '0912-555-210', plan: '無有效方案', bg: '#FFFFFF' }
      ],
      plans: [
        { name: '套票（全店通）', detail: '剩 7 次・到期 2026/12/31', status: '使用中', bg: '#DCEBE4', fg: '#173F32' },
        { name: '月票（中和店）', detail: '2026/8/15 – 2026/9/14', status: '已到期', bg: '#E9E5DD', fg: '#3A362F' }
      ],
      visits: [
        { when: '9/28（一）14:32', where: '中和店・入場機' },
        { when: '9/24（四）19:05', where: '[分館 B]・入場機' },
        { when: '9/20（日）10:48', where: '中和店・櫃檯' },
        { when: '9/17（四）20:11', where: '中和店・入場機' },
        { when: '9/13（日）15:26', where: '[分館 C]・入場機' }
      ],
      orders: [
        { when: '9/1', item: '套票（全店通）', amt: 'NT$ 3,600' },
        { when: '8/15', item: '月票（中和店）', amt: 'NT$ 2,800' },
        { when: '8/15', item: '初階攀岩鞋租借', amt: 'NT$ 100' }
      ]
    };
  }
}
</script>
</body>
</html>
