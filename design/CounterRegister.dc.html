<div style="display: flex; flex-direction: column; gap: 6px"><label for="f6" style="font-size: 14px; font-weight: 500">主要分館</label><select id="f6" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-family: inherit; color: #1C1A17"><option>中和店</option><option>[分館 B]</option></select></div>

<div style="display: flex; flex-direction: column; gap: 6px"><label for="f9" style="font-size: 14px; font-weight: 500">關係</label><input id="f9" type="text" placeholder="例：家人、朋友" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-family: inherit; color: #1C1A17"></div>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" style="width: 22px; height: 22px">同意收到原岩的活動與優惠訊息（選填）</label>
<div style="padding: 12px 14px; border-radius: 10px; background: #F3F0EA; font-size: 14px; color: #5E584F">未滿 18 歲時，同意書步驟會要求法定代理人一起簽署。</div>
</div>

<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
入場時核對本人用</div>

<a href="CounterWaiver.dc.html" style="height: 44px; padding: 0 16px; border: 1px solid #CFC8BC; border-radius: 10px; background: #FFFFFF; font-size: 15px; font-family: inherit; color: #1C1A17; display: flex; align-items: center; justify-content: center; text-decoration: none">交給客人簽署</a>
